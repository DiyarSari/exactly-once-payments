services:
  postgres:
    image: postgres:17-alpine
    container_name: transfer-postgres
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a locally installed PostgreSQL
    volumes:
      - transfer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  transfer-pgdata:
